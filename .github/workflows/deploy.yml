# Standard Docusaurus GitHub Pages deploy.
#
# TODO before enabling Pages:
#   - Set `url`, `baseUrl`, `organizationName`, `projectName` in docusaurus.config.ts
#     to real values (they are placeholders right now).
#   - In the repo: Settings → Pages → Build and deployment → Source = "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Permissions needed for the GitHub Pages deploy.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build website (released locales only)
        # Plain build: HANDBOOK_INCLUDE_UNRELEASED is unset, so LOCALES is only
        # RELEASED_LOCALES. Gated locales are validated in CI but deliberately
        # excluded from the public deploy until they're launch-ready. The live
        # membership of both sets lives in docusaurus.config.ts — don't restate it
        # here, a locale list in a comment is a fact with an expiry date.
        run: npm run build
      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
