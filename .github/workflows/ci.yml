# CI gates for every Pull Request (and every branch push except `main`).
#
# `main` is covered by the separate deploy workflow (.github/workflows/deploy.yml),
# so we skip pushes to `main` here to avoid running the same build twice.
#
# Gates (all must pass — branch protection should require them):
#   1. build   — `npm run build` for BOTH locales; the real correctness gate
#                (onBrokenLinks: 'throw' catches dead internal links; a broken i18n
#                tree fails the build).
#   2. lint    — markdown structure/format hygiene (markdownlint-cli2).
#   3. leak    — generic secret / credential / local-path / email scan.
name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (both locales)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        # The build transpiles without type-checking, so a TypeScript major bump that
        # breaks tsconfig.json (TS 7 removed baseUrl) passed every other check.
        run: npm run typecheck
      - name: Build website (all locales, including unreleased) + i18n link gate
        # HANDBOOK_INCLUDE_UNRELEASED=1 pulls UNRELEASED_LOCALES into
        # LOCALES so their i18n tree is built and broken-link/i18n-validated here —
        # the deploy workflow leaves this unset, so the public site never serves them.
        # onBrokenLinks warns (not throws) in this mode so gated partial translation
        # doesn't hard-fail on EN-fallback lessons that link to the already-translated
        # glossary across trees (see docusaurus.config.ts). i18n-link-check.sh runs the
        # build and re-imposes the hard gate on every REAL broken link: any breakage in
        # a released locale (en/ru) or on a genuinely-translated unreleased-locale page
        # still fails CI; only pure EN-fallback→glossary links are tolerated. It runs its
        # own classifier self-test first (fast, no build) — #307 was a mapping bug that a
        # PASSing gate hid indefinitely, so the classifier is now asserted, not assumed.
        run: bash scripts/i18n-link-check.sh

  lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Markdown lint
        run: npm run lint:md

  leak-scan:
    name: Generic leak scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generic leak scan
        run: bash scripts/leak-scan.sh

  icon-register:
    name: Icon register drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The icon assets must live under src/ to be importable, and the canon that documents them
      # lives in editorial/. This asserts the two have not drifted apart.
      - name: Icon register drift check
        run: bash scripts/icon-register-check.sh

  locale-review-tools:
    name: Locale-review instrument self-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The tools in scripts/locale-review/ are not build gates — they produce the work list a
      # translator acts on. A broken build gate goes red; a broken INSTRUMENT returns a
      # confident, well-formed, wrong answer, which is what happened eight separate times
      # across the German waves. Each self-test below reproduces one of those failures, needs
      # no build and no network, and is the only thing standing between a silent regression and
      # rediscovering it the expensive way. See scripts/locale-review/README.md.
      - name: Locale-review instrument self-tests
        run: bash scripts/locale-review/self-test.sh

  locale-parity:
    name: Locale structural parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The build proves a locale's pages EXIST and link correctly; it says nothing about whether a
      # translated page still has the same sections, the same card nodes or the same figures as its
      # English source. This asserts the shape (see the script header for what is asserted, what was
      # deliberately relaxed, and on what measured evidence).
      # Runs FIRST: per-course locale scope decides whether a course/locale pair is checked at
      # all, so a mistake there shows up as silence rather than as a finding. The corpus cannot
      # exercise it while every course claims every locale, so it is asserted against synthetic
      # trees instead — including that a claimed-but-missing translation still fails.
      - name: Locale scope self-test
        run: bash scripts/locale-parity-check.sh --self-test
      - name: Locale structural parity
        run: bash scripts/locale-parity-check.sh
      # Parity asserts that the locales have the same SHAPE. It says nothing about whether a
      # locale obeys its own language canon, and two rules that were written down in
      # editorial/canon/sk/_language.md were violated in shipped, deployed Slovak prose for
      # months: 20 quotations closed with an ASCII quote (#431) and the gender of `pipeline`
      # split 18 against 21 across both courses (#432). Both are valid Markdown, so the build
      # was green throughout. A rule in a canon is documentation; only this makes it a rule.
      - name: Slovak canon self-test
        run: python3 scripts/sk-canon-check.py --self-test
      - name: Slovak canon gate
        run: python3 scripts/sk-canon-check.py
      # Russian earned the same gate the same way. Four rulings live in editorial/canon/ru/ and
      # all four were violated in shipped prose: «ИИ» 52 times (#539), a spaced percent sign in
      # two files of one course (#544), plus the «контроли» plural and «гейт» that owner
      # rulings had already retired. Twice the rule survived only as an ILLUSTRATION and the
      # illustration taught the losing form — the decimal-comma example was written «34,85 %»
      # against 175 tight instances, and it then survived a full page rebuild because the
      # writer copied the canon's own example.
      - name: Russian canon self-test
        run: python3 scripts/ru-canon-check.py --self-test
      - name: Russian canon gate
        run: python3 scripts/ru-canon-check.py
      # The course map's 🚧 went stale: Parts I and II were complete and still marked under
      # construction in both locales. A Part's 🚧 now follows its own "Published: N of M" line.
      - name: Course status self-test
        run: python3 scripts/course-status-check.py --self-test
      - name: Course status gate
        run: python3 scripts/course-status-check.py
      # Evidence grades left the reading layer in #800: 325 inline `MEASURED`-style tokens
      # across three locales read as audit metadata. The grade is now carried by the wording
      # and recorded in editorial/evidence/; this keeps the tokens from returning and the
      # ledger's sources from silently leaving their pages.
      # A section link is written once and shared by every locale, so it can only point at an
      # explicit id: an auto-slug is a different string in every language and moves when the
      # heading is reworded (#813). Check 3 above keeps the ids equal across locales; this keeps
      # every heading carrying one.
      - name: Heading id self-test
        run: python3 scripts/heading-id-check.py --self-test
      - name: Heading id gate
        run: python3 scripts/heading-id-check.py
      - name: Evidence ledger self-test
        run: python3 scripts/evidence-ledger-check.py --self-test
      - name: Evidence ledger gate
        run: python3 scripts/evidence-ledger-check.py
